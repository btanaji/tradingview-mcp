# Publish server.json to the official MCP Registry
# (registry.modelcontextprotocol.io). Manual trigger only — run it after
# bumping `version` in server.json. Auth is GitHub OIDC: any workflow in this
# repo is authorized for the io.github.atilaahmettaner/* namespace, no secrets
# needed. Downstream directories (PulseMCP and others) ingest the official
# registry, so this one publish fans out.
name: Publish to MCP Registry

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for registry login
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/').tar.gz" | tar xz mcp-publisher

      - name: Login to registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
